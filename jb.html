<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 HEN</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      /* Status screen. jb.js only ever sets body.done / body.fail / body.log,
         so every rule below is reactive CSS -- no JavaScript is added and the
         jailbreak path is untouched.

         The dots animate `transform`, not `opacity`, and that is on purpose:
         the exploit owns the main thread for most of the run, and only a
         composited transform keeps moving under that load. Opacity keyframes
         freeze mid-cycle there, which reads as a static "...". */
      #ui {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        padding: 0 24px;
      }
      #wait,
      #ok,
      #bad {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.1em;
      }
      #wait {
        display: block;
        color: #e6ebf2;
      }
      #dots {
        color: #7fd0a0;
      }
      /* one slot per dot, revealed left to right, so the line never reflows */
      #dots span {
        display: inline-block;
      }
      #dots .d1 {
        animation: dot1 1.6s infinite;
      }
      #dots .d2 {
        animation: dot2 1.6s infinite;
      }
      #dots .d3 {
        animation: dot3 1.6s infinite;
      }
      @keyframes dot1 {
        0%,
        74% {
          transform: scale(1);
        }
        75%,
        100% {
          transform: scale(0);
        }
      }
      @keyframes dot2 {
        0%,
        24% {
          transform: scale(0);
        }
        25%,
        74% {
          transform: scale(1);
        }
        75%,
        100% {
          transform: scale(0);
        }
      }
      @keyframes dot3 {
        0%,
        49% {
          transform: scale(0);
        }
        50%,
        74% {
          transform: scale(1);
        }
        75%,
        100% {
          transform: scale(0);
        }
      }
      #ok,
      #bad {
        display: none;
        font-size: 18px;
        font-weight: 700;
      }
      #ok {
        color: #7fd0a0;
        text-shadow: 0 0 16px rgba(127, 208, 160, 0.45);
      }
      #bad {
        color: #d08a7f;
        text-shadow: 0 0 16px rgba(208, 138, 127, 0.45);
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #wait,
      body.fail #wait {
        display: none;
      }
      body.done #ok {
        display: block;
      }
      body.fail #bad {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #ui {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 90px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <!-- Status UI. jb.js publishes its outcome through document.body.className,
         so this is pure CSS: nothing here can affect the exploit. -->
    <div id="ui">
      <div id="wait">PLEASE WAIT, ENABLING HEN<span id="dots"><span class="d1">.</span><span class="d2">.</span><span class="d3">.</span></span></div>
      <div id="ok">HEN LOADED SUCCESSFULLY</div>
      <div id="bad">HEN FAILED &mdash; RESTART YOUR CONSOLE</div>
    </div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
