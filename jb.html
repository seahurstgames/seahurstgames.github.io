<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 HEN</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      /* running: "PLEASE WAIT, ENABLING HEN" with accumulating dots.
         jb.js only sets body.done / body.fail / body.log, so this is pure
         CSS and the jailbreak code path is untouched. */
      #status {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: #e6ebf2;
      }
      #status .d1,
      #status .d2,
      #status .d3 {
        opacity: 0;
      }
      #status .d1 {
        animation: dot1 1.6s infinite;
      }
      #status .d2 {
        animation: dot2 1.6s infinite;
      }
      #status .d3 {
        animation: dot3 1.6s infinite;
      }
      /* one dot, two dots, three dots, then a blank beat */
      @keyframes dot1 {
        0%,
        74% {
          opacity: 1;
        }
        75%,
        100% {
          opacity: 0;
        }
      }
      @keyframes dot2 {
        0%,
        24% {
          opacity: 0;
        }
        25%,
        74% {
          opacity: 1;
        }
        75%,
        100% {
          opacity: 0;
        }
      }
      @keyframes dot3 {
        0%,
        49% {
          opacity: 0;
        }
        50%,
        74% {
          opacity: 1;
        }
        75%,
        100% {
          opacity: 0;
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #status {
        display: none;
      }
      body.fail #status {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #status,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 90px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <!-- jb.js only sets body.done / body.fail / body.log, so the whole
         status line below is pure CSS; the jailbreak path is untouched. -->
    <div id="status">PLEASE WAIT, ENABLING HEN<span class="d1">.</span><span class="d2">.</span><span class="d3">.</span></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
